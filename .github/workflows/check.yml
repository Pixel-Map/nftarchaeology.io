name: Validate archive
on: [push, pull_request]
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm exec -- react-scripts test --watchAll=false --runInBand
        env:
          CI: true
      - run: npm run check:ui
